[project]
name = "climate-risk"
version = "2.0.0"
description = "Scenario-conditional US Treasury yield curves and climate-adjusted credit spreads to 2100 under SSP transition pathways"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emanuele Migliaccio" }]
keywords = ["climate risk", "term structure", "Nelson-Siegel", "credit spreads", "SSP scenarios", "copula"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.scripts]
climate-risk = "climate_risk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
notebooks = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climate_risk"]

[tool.hatch.build.targets.sdist]
# Code, tests and the small public inputs; generated results and notebooks stay in the repository.
include = [
  "/src/climate_risk",
  "/tests",
  "/data/processed",
  "/data/scenarios",
  "/data/sectors.csv",
  "/data/README.md",
  "/docs",
  "/references",
  "/README.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/LICENSE",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF", "PT", "C4"]
ignore = [
    "N803",  # argument names such as `T`, `Q` follow the mathematical notation of the papers
    "N806",  # same for local variables
    "RUF001", "RUF002", "RUF003",  # Greek letters in docstrings/comments are intentional
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["slow: tests that run a larger Monte Carlo"]
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["climate_risk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.12"
files = ["src/climate_risk"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true
